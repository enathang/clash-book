<svg viewBox="0 0 500 208" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How any BitPack-derived type is represented in hardware, generalizing Maybe a: the wires split into a constructor region of clog2(constructor count) wires (2 here, for a 3-constructor type) and a field region of max_field_size wires (32 here, sized to the largest constructor and left undefined for smaller ones). Both are plain wires -- no packing logic.">

  <style>
    :root { color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e6edf3; }
    }
  </style>

