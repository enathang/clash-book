name: Deploy mdBook site to Pages

on:
  push:
    branches: [main, v0.1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install mdbook and preprocessors
        run: |
          cargo install mdbook --version "0.4.52" --locked --force
          cargo install mdbook-admonish
          cargo install mdbook-quiz --locked --version 0.4.0
          cargo install mdbook-mermaid --version 0.16.2 --locked
          cargo install mdbook-chapter-zero
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
