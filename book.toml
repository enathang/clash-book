[book]
title = "A Gentle Introduction to Clash"
authors = ["Nathan Gifford"]
language = "en"
src = "src"

[output.html]
additional-css = ["./mdbook-admonish.css", "./mdbook-admonish-custom.css", "./mermaid-custom.css", "./blockquote-custom.css", "./code-highlight.css", "./code-tabs.css", "./image-zoom.css", "./sidebar-title-indent.css", "./sketchpad.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "admonish-link.js", "code-highlight.js", "code-tabs.js", "image-zoom.js", "sidebar-title-indent.js", "sketchpad.js"]

[output.html.fold]
enable = true
level = 0

[preprocessor]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

# Custom admonish type: ```admonish exercise title="..."
# The visual styling lives in mdbook-admonish-custom.css (hand-maintained).
[[preprocessor.admonish.custom]]
directive = "exercise"
icon = "./icons/GlyphsCode1Outline.svg"
color = "#9e9e9e"

[preprocessor.quiz]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.chapter-zero]
levels = [0]   # top-level chapters start at 0
